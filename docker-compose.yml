version: '3.9'

services:
  # ─── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: abay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: abay
      POSTGRES_PASSWORD: abay_secret_2024
      POSTGRES_DB: abaydriver
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U abay -d abaydriver']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (optional — for session caching / rate limiting) ───────────────
  redis:
    image: redis:7-alpine
    container_name: abay_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abay_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://abay:abay_secret_2024@postgres:5432/abaydriver
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_this_access_secret_in_prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_refresh_secret_in_prod}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      AT_API_KEY: ${AT_API_KEY}
      AT_USERNAME: ${AT_USERNAME}
      AT_SENDER_ID: ${AT_SENDER_ID:-AbayDriver}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - '5000:5000'
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Web Dashboard ────────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: abay_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '3000:80'
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}

volumes:
  postgres_data:
  uploads_data:

networks:
  default:
    name: abay_network
