services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: abay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-abaydriver}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-abay} -d ${POSTGRES_DB:-abaydriver}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: abay_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abay_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-abay}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-abaydriver}
      REDIS_URL: redis://redis:6379
      BACKEND_URL: ${BACKEND_URL:-http://localhost:5000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      AT_API_KEY: ${AT_API_KEY}
      AT_USERNAME: ${AT_USERNAME}
      AT_SENDER_ID: ${AT_SENDER_ID:-AbayDriver}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      TELEBIRR_APP_ID: ${TELEBIRR_APP_ID}
      TELEBIRR_APP_KEY: ${TELEBIRR_APP_KEY}
      TELEBIRR_SHORT_CODE: ${TELEBIRR_SHORT_CODE}
      CBE_MERCHANT_ID: ${CBE_MERCHANT_ID}
      CBE_SECRET_KEY: ${CBE_SECRET_KEY}
      AWASH_WEBHOOK_SECRET: ${AWASH_WEBHOOK_SECRET}
      DASHEN_WEBHOOK_SECRET: ${DASHEN_WEBHOOK_SECRET}
    ports:
      - '5001:5000'
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Database Backup ───────────────────────────────────────────────────────
  # Runs pg_dump daily at 02:00 UTC and keeps the last 7 backups.
  # Backups are stored in the db_backups volume as timestamped .sql.gz files.
  db-backup:
    image: postgres:15-alpine
    container_name: abay_db_backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_backups:/backups
    entrypoint: >
      sh -c "
        echo 'Starting backup scheduler...';
        while true; do
          FILENAME=/backups/abay_$$(date +%Y%m%d_%H%M%S).sql.gz;
          echo \"[backup] dumping to $$FILENAME\";
          pg_dump -h postgres -U ${POSTGRES_USER:-abay} ${POSTGRES_DB:-abaydriver} | gzip > $$FILENAME;
          echo \"[backup] done. Pruning old backups (keep last 7)...\";
          ls -t /backups/*.sql.gz 2>/dev/null | tail -n +8 | xargs -r rm --;
          echo \"[backup] sleeping 24h...\";
          sleep 86400;
        done
      "

  # ─── Web Dashboard ─────────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: abay_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '3000:80'

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  db_backups:

networks:
  default:
    name: abay_network
