# ─── Host-level Nginx config for Abay Driver on a VPS ────────────────────────
#
# Assumptions:
#   - Your domain is abaydriver.et (replace everywhere below)
#   - SSL certificates issued by certbot (Let's Encrypt)
#   - Docker Compose stack bound to localhost:3000 (web) and localhost:5000 (backend)
#
# Installation:
#   1. Copy to /etc/nginx/sites-available/abaydriver
#   2. ln -s /etc/nginx/sites-available/abaydriver /etc/nginx/sites-enabled/
#   3. Replace all occurrences of abaydriver.et with your actual domain
#   4. Run: sudo certbot --nginx -d abaydriver.et -d www.abaydriver.et
#   5. nginx -t && systemctl reload nginx

# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name abaydriver.et www.abaydriver.et;

    # Allow Let's Encrypt ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Main HTTPS server ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name abaydriver.et www.abaydriver.et;

    # SSL — certbot will fill these in (or fill manually)
    ssl_certificate     /etc/letsencrypt/live/abaydriver.et/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abaydriver.et/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self)" always;

    # Upload size limit — 10 MB for cargo photos and driver documents
    client_max_body_size 10M;

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Uploads served directly from the API container ────────────────────────
    location /uploads {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        expires            7d;
        add_header         Cache-Control "public";
    }

    # ── Socket.IO WebSocket ───────────────────────────────────────────────────
    location /socket.io {
        proxy_pass             http://127.0.0.1:5000;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_set_header       X-Real-IP  $remote_addr;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
    }

    # ── Health check (used by uptime monitors) ────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:5000;
        access_log off;
    }

    # ── React web dashboard (SPA) ─────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Logging
    access_log /var/log/nginx/abaydriver-access.log;
    error_log  /var/log/nginx/abaydriver-error.log warn;
}
