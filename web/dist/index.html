<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ET SPARK | Admin Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .navbar {
      background: linear-gradient(135deg, #1B4332 0%, #2D6A4F 100%);
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .navbar h1 {
      font-size: 24px;
      font-weight: 700;
    }

    .logout-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.3s;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }

    .stat-label {
      color: #666;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #1B4332;
      margin-bottom: 4px;
    }

    .stat-unit {
      color: #999;
      font-size: 12px;
    }

    .features-section h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #1B4332;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .feature-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .feature-card:hover {
      border-color: #1B4332;
      box-shadow: 0 8px 16px rgba(27, 67, 50, 0.2);
    }

    .feature-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .feature-name {
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }

    .loading {
      text-align: center;
      color: #1B4332;
      padding: 40px;
    }

    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid #1B4332;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-banner {
      background: #fee;
      color: #c33;
      padding: 16px 24px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 4px solid #c33;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <h1>ET SPARK</h1>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>

  <div class="container">
    <div id="errorBanner" class="error-banner" style="display: none;"></div>

    <div id="loadingDiv" class="loading">
      <div class="spinner"></div>
      <p>Loading dashboard...</p>
    </div>

    <div id="dashboardContent" style="display: none;">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Drivers</div>
          <div class="stat-value" id="driverCount">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Stores</div>
          <div class="stat-value" id="storeCount">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Orders</div>
          <div class="stat-value" id="orderCount">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Revenue</div>
          <div class="stat-value" id="revenue">-</div>
          <div class="stat-unit">ETB</div>
        </div>
      </div>

      <div class="features-section">
        <h2>Admin Features</h2>
        <div class="features-grid">
          <div class="feature-card">
            <div class="feature-icon">📊</div>
            <div class="feature-name">Driver Earnings</div>
          </div>
          <div class="feature-card">
            <div class="feature-icon">📈</div>
            <div class="feature-name">Financial Reports</div>
          </div>
          <div class="feature-card">
            <div class="feature-icon">👥</div>
            <div class="feature-name">Customer Management</div>
          </div>
          <div class="feature-card">
            <div class="feature-icon">🔔</div>
            <div class="feature-name">Push Notifications</div>
          </div>
          <div class="feature-card">
            <div class="feature-icon">⚙️</div>
            <div class="feature-name">Commission Settings</div>
          </div>
          <div class="feature-card">
            <div class="feature-icon">🎁</div>
            <div class="feature-name">Promo Codes</div>
          </div>
          <div class="feature-card">
            <div class="feature-icon">📝</div>
            <div class="feature-name">Activity Logs</div>
          </div>
          <div class="feature-card">
            <div class="feature-icon">🚨</div>
            <div class="feature-name">Fraud Detection</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://europe-west1-abay-clone-project-36721.cloudfunctions.net/api';

    async function initialize() {
      const token = localStorage.getItem('accessToken');

      if (!token) {
        window.location.href = '/login.html';
        return;
      }

      try {
        await loadDashboard();
      } catch (error) {
        console.error('Dashboard load error:', error);
        showError('Failed to load dashboard');
      }
    }

    async function loadDashboard() {
      const token = localStorage.getItem('accessToken');

      try {
        const response = await fetch(`${API_URL}/admin/dashboard`, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
          },
        });

        if (!response.ok) {
          if (response.status === 401) {
            localStorage.clear();
            window.location.href = '/login.html';
            return;
          }
          throw new Error(`API error: ${response.status}`);
        }

        const data = await response.json();

        document.getElementById('driverCount').textContent = data.totalDrivers || 0;
        document.getElementById('storeCount').textContent = data.totalStores || 0;
        document.getElementById('orderCount').textContent = data.totalOrders || 0;
        document.getElementById('revenue').textContent = (data.totalRevenue || 0).toLocaleString();

        document.getElementById('loadingDiv').style.display = 'none';
        document.getElementById('dashboardContent').style.display = 'block';
      } catch (error) {
        console.error('Load dashboard error:', error);
        document.getElementById('loadingDiv').style.display = 'none';
        showError('Failed to load dashboard data: ' + error.message);
      }
    }

    function showError(message) {
      const errorBanner = document.getElementById('errorBanner');
      errorBanner.textContent = message;
      errorBanner.style.display = 'block';
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.clear();
      window.location.href = '/login.html';
    });

    initialize();
  </script>
</body>
</html>
