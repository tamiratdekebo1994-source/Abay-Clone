<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ET SPARK | Admin Login</title>
  <style>
    :root {
      --color-primary: #1B4332;
      --color-primary-light: #2D6A4F;
      --color-primary-lighter: #40916C;
      --color-text-primary: #1A1A1A;
      --color-text-secondary: #4A4A4A;
      --color-text-muted: #7A7A7A;
      --color-bg-page: #FFFFFF;
      --color-bg-subtle: #F8F9FA;
      --color-border: #E5E7EB;
      --color-error: #EF4444;
      --color-error-bg: #FEE2E2;
      --color-success: #10B981;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-primary: #52B788;
        --color-primary-light: #74C69D;
        --color-text-primary: #F0F0F0;
        --color-text-secondary: #D4D4D4;
        --color-text-muted: #A8A8A8;
        --color-bg-page: #1A1A1A;
        --color-bg-subtle: #2D2D2D;
        --color-border: #404040;
        --color-error-bg: #7F1D1D;
      }
    }

    :root[data-theme="light"] {
      --color-primary: #1B4332;
      --color-primary-light: #2D6A4F;
      --color-text-primary: #1A1A1A;
      --color-text-secondary: #4A4A4A;
      --color-text-muted: #7A7A7A;
      --color-bg-page: #FFFFFF;
      --color-bg-subtle: #F8F9FA;
      --color-border: #E5E7EB;
      --color-error-bg: #FEE2E2;
    }

    :root[data-theme="dark"] {
      --color-primary: #52B788;
      --color-primary-light: #74C69D;
      --color-text-primary: #F0F0F0;
      --color-text-secondary: #D4D4D4;
      --color-text-muted: #A8A8A8;
      --color-bg-page: #1A1A1A;
      --color-bg-subtle: #2D2D2D;
      --color-border: #404040;
      --color-error-bg: #7F1D1D;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-bg-page);
      color: var(--color-text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .login-page {
      display: flex;
      width: 100%;
      max-width: 1200px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      background: var(--color-bg-page);
    }

    .login-visual {
      display: none;
      flex: 1;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
      padding: 48px;
      color: white;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    @media (min-width: 768px) {
      .login-visual {
        display: flex;
      }
    }

    .visual-content h2 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    .visual-content p {
      font-size: 16px;
      line-height: 1.6;
      opacity: 0.95;
      max-width: 300px;
    }

    .login-form-container {
      flex: 1;
      padding: 64px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    @media (max-width: 768px) {
      .login-form-container {
        padding: 48px 24px;
      }
    }

    .logo-brand {
      margin-bottom: 48px;
    }

    .logo-brand h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .logo-brand p {
      font-size: 14px;
      color: var(--color-text-muted);
      font-weight: 500;
    }

    .form-header {
      margin-bottom: 32px;
    }

    .form-header h2 {
      font-size: 24px;
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .form-header p {
      font-size: 14px;
      color: var(--color-text-secondary);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: 8px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--color-border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: var(--color-bg-subtle);
      color: var(--color-text-primary);
      transition: all 0.2s ease;
    }

    input::placeholder {
      color: var(--color-text-muted);
    }

    input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 4px rgba(27, 67, 50, 0.1);
      background: var(--color-bg-page);
    }

    .error-message {
      display: none;
      background: var(--color-error-bg);
      color: var(--color-error);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 24px;
      font-size: 13px;
      border-left: 4px solid var(--color-error);
      line-height: 1.5;
    }

    .error-message.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-btn {
      width: 100%;
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      position: relative;
      overflow: hidden;
    }

    .login-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(27, 67, 50, 0.2);
    }

    .login-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .loading {
      display: none;
      text-align: center;
      color: var(--color-primary);
      font-size: 13px;
      margin-top: 16px;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .loading.show {
      display: flex;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--color-primary);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .form-footer {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--color-border);
      font-size: 12px;
      color: var(--color-text-muted);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-visual">
      <div class="visual-content">
        <h2>Welcome to ET SPARK</h2>
        <p>Manage your delivery network with powerful insights and analytics</p>
      </div>
    </div>

    <div class="login-form-container">
      <div class="logo-brand">
        <h1>ET SPARK</h1>
        <p>ADMIN DASHBOARD</p>
      </div>

      <div class="form-header">
        <h2>Sign In</h2>
        <p>Enter your credentials to access the dashboard</p>
      </div>

      <div class="error-message" id="errorMsg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            placeholder="+251972735128"
            required
            autocomplete="tel"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          />
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          Sign In
        </button>

        <div class="loading" id="loading">
          <span class="spinner"></span>
          <span>Signing in...</span>
        </div>
      </form>

      <div class="form-footer">
        <strong>Demo Credentials:</strong><br>
        Phone: +251972735128<br>
        Password: Admin@1234
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://europe-west1-abay-clone-project-36721.cloudfunctions.net/api';

    const form = document.getElementById('loginForm');
    const phoneInput = document.getElementById('phone');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');
    const loading = document.getElementById('loading');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('show');
      errorMsg.textContent = '';

      const phone = phoneInput.value.trim();
      const password = passwordInput.value;

      if (!phone || !password) {
        showError('Please fill in all fields');
        return;
      }

      loginBtn.disabled = true;
      loading.style.display = 'block';

      try {
        const response = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ phone, password }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Login failed');
        }

        if (data.token) {
          localStorage.setItem('accessToken', data.token);
          if (data.user?.uid) {
            localStorage.setItem('userId', data.user.uid);
          }
          window.location.href = '/index.html';
        } else {
          throw new Error('No token received');
        }
      } catch (error) {
        showError(error.message || 'Login failed. Please try again.');
        console.error('Login error:', error);
      } finally {
        loginBtn.disabled = false;
        loading.style.display = 'none';
      }
    });

    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.classList.add('show');
    }
  </script>
</body>
</html>
